name: CI - Lint & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Syntax check all Python files
        run: |
          python -m py_compile app.py
          python -m py_compile slop_filter.py
          python -m py_compile trend_research.py
          python -m py_compile postgres_client.py
          python -m py_compile quality_gate.py
          python -m py_compile seo_optimizer.py
          python -m py_compile content_repurposer.py
          python -m py_compile cover_image_generator.py
          python -m py_compile copywriting_enhancer.py
          echo "All Python files compile successfully"

      - name: Lint with flake8 (warnings only)
        run: |
          # Stop on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,skills
          # Warn on style issues but don't fail
          flake8 . --count --exit-zero --max-complexity=20 --max-line-length=200 --statistics --exclude=.git,__pycache__,skills

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run quality gate tests
        run: |
          python -c "
          from quality_gate import run_quality_gate, format_quality_report

          # Test with sample content
          sample = '''# Test Blog Post

          This is a well-structured blog post about Python programming.

          ## Getting Started

          Python is a versatile language used by millions of developers worldwide.
          It offers clean syntax and powerful libraries for web development, data science, and AI.

          ## Key Features

          Here are the main features:
          - Easy to learn
          - Large ecosystem
          - Cross-platform support

          ## Conclusion

          Python remains one of the best choices for modern development.
          '''

          result = run_quality_gate(sample)
          assert 'overall_score' in result
          assert 'grade' in result
          assert 'passed' in result
          assert 'checks' in result
          assert result['overall_score'] >= 0 and result['overall_score'] <= 100

          report = format_quality_report(result)
          assert len(report) > 0

          print(f'Quality gate: {result[\"grade\"]} ({result[\"overall_score\"]}/100)')
          print('Quality gate tests passed')
          "

      - name: Run slop filter tests
        run: |
          python -c "
          from slop_filter import quick_slop_check, strip_em_dashes

          # Test quick check
          score, patterns = quick_slop_check('We need to leverage robust solutions to delve into this paradigm shift.')
          assert score >= 3, f'Expected 3+ patterns, got {score}'
          print(f'Slop check found {score} patterns: {patterns}')

          # Test em-dash removal
          result = strip_em_dashes('Hello — world – test')
          assert '—' not in result
          assert '–' not in result
          assert ' - ' in result
          print(f'Em-dash removal: {result}')

          print('Slop filter tests passed')
          "

      - name: Run SEO analyzer tests
        run: |
          python -c "
          from seo_optimizer import analyze_seo_deep

          sample = '''# How to Build a REST API with Python Flask

          Flask is a lightweight web framework. This guide shows you how to build
          a production-ready REST API with Python Flask in under 30 minutes.

          ## Prerequisites

          You need Python 3.8+ and pip installed on your machine.

          ## Setting Up

          Install Flask with pip install flask. Create a new file called app.py.
          '''

          result = analyze_seo_deep(sample, target_keywords=['flask', 'api', 'python'])
          assert 'overall_score' in result
          assert 'keyword_density' in result
          assert 'word_count' in result
          assert result['word_count'] > 0

          print(f'SEO score: {result[\"overall_score\"]}/100, words: {result[\"word_count\"]}')
          print('SEO analyzer tests passed')
          "

      - name: Run content repurposer tests
        run: |
          python -c "
          from content_repurposer import repurpose_all

          # Test with None ai_manager (should use fallbacks)
          result = repurpose_all('Test blog post about AI tools for developers.', None)
          assert 'twitter_thread' in result
          assert 'linkedin_post' in result
          assert 'newsletter' in result
          print('Content repurposer fallback tests passed')
          "

  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -s "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "Render deploy triggered"
          else
            echo "RENDER_DEPLOY_HOOK not set, skipping deploy"
          fi
